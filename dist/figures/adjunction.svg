<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 175" role="img" aria-labelledby="title desc">
  <title id="title">An adjoint pair of functors</title>
  <desc id="desc">F goes from category C to category D. G goes from D to C. F is left adjoint to G.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#26354a" stroke-width="1.3"/></marker></defs>
  <g fill="none" stroke="#26354a" stroke-width="1.5" marker-end="url(#arrow)"><path d="M145 62 H375"/><path d="M375 90 H145"/></g>
  <g fill="#182738" font-family="Georgia,serif" text-anchor="middle" font-size="30" font-style="italic"><text x="112" y="87">C</text><text x="408" y="87">D</text><text x="260" y="44" font-size="23">F</text><text x="260" y="118" font-size="23">G</text></g>
  <text x="260" y="161" text-anchor="middle" fill="#244be0" font-family="Georgia,serif" font-size="24">F ⊣ G</text>
</svg>
