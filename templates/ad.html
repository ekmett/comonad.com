<figure class="interactive-figure" id="ad-figure" data-demo="ad">
  <p class="figure-equation">f(x, y) = xy + sin(x)</p>
  <div class="figure-controls"><label>x <input data-control="x" type="range" min="-3" max="3" step="0.1" value="1"><output data-view="x"></output></label><label>y <input data-control="y" type="range" min="-3" max="3" step="0.1" value="2"><output data-view="y"></output></label></div>
  <svg data-view="graph" class="ad-graph" viewBox="0 0 400 345" role="img" aria-label="Computation graph for x times y plus sine of x"></svg>
  <div class="figure-controls"><label>Step <input data-control="step" type="range" min="0" max="8" value="8"></label><button data-control="next" type="button">Restart</button></div>
  <p class="figure-trace" data-view="trace" aria-live="polite"></p><p data-view="gradient"></p>
  <figcaption><span data-view="status" role="status">Loading the Haskell figure…</span> Values flow forward; sensitivities flow backward and add at shared inputs. <a href="{{root}}source/ADDemo.hs">Haskell source</a> · <a href="{{root}}source/browser-sources.zip">All Haskell sources</a>.</figcaption>
  <noscript>Enable JavaScript and WebAssembly to step through the tape. The gradient is (y + cos(x), x).</noscript>
</figure>
