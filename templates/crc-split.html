<figure class="experiment" aria-labelledby="split-title">
<div class="section-heading"><div><h3 id="split-title">Try a different split</h3><p>Move the boundary. Each half carries enough information to compose the whole.</p></div></div>
<div class="input-heading"><label for="message">Your message</label><div class="presets"><button type="button" data-preset="123456789">Test vector</button><button type="button" data-preset="A checksum needn't begin at the beginning.">Sentence</button><button type="button" data-preset="λ → Haskell 🦀">Unicode</button><button type="button" data-preset="">Empty</button></div></div>
<textarea id="message" rows="2" maxlength="1024" spellcheck="false" disabled>123456789</textarea>
<div class="slider-label"><label for="split">Split after <strong id="split-position">4</strong> bytes</label><span id="byte-count">9 UTF-8 bytes</span></div>
<input id="split" type="range" min="0" max="9" value="4" disabled>
<div class="halves"><div class="half half-a"><div class="half-title"><strong>A</strong><span id="a-count"></span></div><div class="bytes" id="a-bytes"></div><dl><dt>Remainder <i>p</i></dt><dd id="a-p">—</dd><dt>Shift factor <i>m</i></dt><dd id="a-m">—</dd></dl></div><div class="half half-b"><div class="half-title"><strong>B</strong><span id="b-count"></span></div><div class="bytes" id="b-bytes"></div><dl><dt>Remainder <i>q</i></dt><dd id="b-p">—</dd><dt>Shift factor <i>n</i></dt><dd id="b-m">—</dd></dl></div></div>
<div class="composition"><span class="formula">(p, m) ⊗ (q, n) = (pn + q, mn)</span><span>+ is XOR · multiplication is polynomial multiplication modulo the CRC polynomial</span></div>
<div class="results"><div><span class="eyebrow">DIRECT CRC-32</span><output id="direct">—</output><small>One pass over the message</small></div><div><span class="eyebrow">COMPOSED CRC-32</span><output id="combined">—</output><small>Two summaries, one composition</small></div><div class="match" id="match" role="status">Waiting for Haskell</div></div>
<p class="footnote"><span id="runtime" role="status">Loading Haskell…</span> · Bytes are shown in hexadecimal. Splits may fall inside a UTF-8 character; the checksum still works on the exact bytes. Empty pieces are the identity.</p>
</figure>
